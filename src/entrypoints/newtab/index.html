<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Tab</title>
  </head>
  <body>
    <main class="stage">
      <div class="cluster">
        <div class="mark" aria-hidden="true"></div>
        <section class="card" aria-label="Ask Noche">
          <div class="composer">
            <svg class="glyph" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
              <circle cx="7" cy="7" r="4.5" />
              <path d="M10.5 10.5 14 14" />
            </svg>
            <input
              class="field"
              type="text"
              placeholder="Ask anything..."
              aria-label="Ask Noche anything"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <ul class="suggestions" aria-label="Suggestions">
            <li class="chip-row" style="--chip-index: 0">
              <button class="chip" type="button" data-prompt="Summarize this page in three bullets">
                <svg class="glyph" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                  <path d="M3 4h10M3 8h10M3 12h6" />
                </svg>
                Summarize this page in three bullets
              </button>
            </li>
            <li class="chip-row" style="--chip-index: 1">
              <button class="chip" type="button" data-prompt="Draft a reply to this message">
                <svg class="glyph" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2.5 4.5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H8l-3.5 3v-3a2 2 0 0 1-2-2z" />
                </svg>
                Draft a reply to this message
              </button>
            </li>
            <li class="chip-row" style="--chip-index: 2">
              <button class="chip" type="button" data-prompt="Plan my day from my open tabs">
                <svg class="glyph" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                  <path d="M5.5 4h8M5.5 8h8M5.5 12h8" />
                  <path d="M2.5 4h.01M2.5 8h.01M2.5 12h.01" />
                </svg>
                Plan my day from my open tabs
              </button>
            </li>
            <li class="chip-row" style="--chip-index: 3">
              <button class="chip" type="button" data-prompt="Explain this code like I am new to it">
                <svg class="glyph" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m5.5 5-3 3 3 3M10.5 5l3 3-3 3" />
                </svg>
                Explain this code like I am new to it
              </button>
            </li>
          </ul>
          <div class="actions">
            <!-- v1 inert controls: wired when their surfaces gain gates. -->
            <button class="icon-btn" type="button" disabled aria-label="Camera capture (coming soon)">
              <svg class="glyph" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 5.5A1.5 1.5 0 0 1 3.5 4h1.2l1-1.5h4.6l1 1.5h1.2A1.5 1.5 0 0 1 14 5.5v6a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z" />
                <circle cx="8" cy="8.5" r="2.4" />
              </svg>
            </button>
            <button class="icon-btn" type="button" disabled aria-label="Voice input (coming soon)">
              <svg class="glyph" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                <rect x="6" y="1.8" width="4" height="7.4" rx="2" />
                <path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.2" />
              </svg>
            </button>
            <span class="spacer" aria-hidden="true"></span>
            <button class="send" type="button" disabled aria-label="Send (coming soon)">
              <svg class="glyph" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M8 13V3.5M4 7.5l4-4 4 4" />
              </svg>
            </button>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

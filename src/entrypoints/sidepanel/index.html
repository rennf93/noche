<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Noche</title>
  </head>
  <body>
    <main class="rail">
      <header class="rail-header">
        <span class="model-badge" id="model-badge" title="">Noche</span>
        <button class="ghost-btn" id="new-chat" title="New chat" aria-label="New chat" hidden>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
      </header>

      <section class="conversation" id="conversation" aria-live="polite" aria-label="Conversation">
        <div class="empty" id="empty">
          <div class="empty-title">Ask about this page</div>
          <div class="empty-sub">The active tab joins the chat as context</div>
        </div>
      </section>

      <footer class="rail-footer">
        <div class="consent-card" id="consent-card" hidden>
          <div class="consent-title" id="consent-title"></div>
          <div class="consent-kind">Write tool: nothing runs without your approval</div>
          <pre class="consent-args" id="consent-args"></pre>
          <div class="consent-actions">
            <button class="btn" id="consent-deny">Deny</button>
            <button class="btn btn-primary" id="consent-approve">Approve once</button>
          </div>
        </div>

        <div class="slash-menu" id="slash-menu" hidden></div>

        <div class="composer-card" id="composer-card">
          <div class="picker-row" id="picker-row" hidden>
            <select class="picker-select" id="pick-provider" aria-label="Provider"></select>
            <select class="picker-select" id="pick-model" aria-label="Model"></select>
          </div>
          <div class="context-chip" id="context-chip" hidden>
            <span class="chip-favicon" id="chip-favicon" aria-hidden="true"></span>
            <span class="chip-text">
              <span class="chip-title" id="chip-title"></span>
              <span class="chip-origin" id="chip-origin"></span>
            </span>
          </div>
          <textarea
            id="composer-input"
            rows="1"
            placeholder="Ask a question about this page..."
            aria-label="Message"
          ></textarea>
          <div class="composer-actions">
            <button
              class="ghost-btn icon-btn"
              id="btn-attach"
              aria-disabled="true"
              title="Attach (coming soon)"
            >
              <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
                <path d="M7.5 3v9M3 7.5h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
              </svg>
            </button>
            <span class="spacer"></span>
            <button
              class="ghost-btn icon-btn"
              id="btn-capture"
              aria-disabled="true"
              title="Capture (coming soon)"
            >
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <rect x="1.75" y="4" width="12.5" height="9" rx="2" stroke="currentColor" stroke-width="1.3" />
                <circle cx="8" cy="8.5" r="2.4" stroke="currentColor" stroke-width="1.3" />
                <path d="M5.5 4l1-1.5h3l1 1.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
              </svg>
            </button>
            <button
              class="ghost-btn icon-btn"
              id="btn-mic"
              aria-disabled="true"
              title="Voice (coming soon)"
            >
              <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
                <rect x="5.4" y="1.75" width="4.2" height="7.5" rx="2.1" stroke="currentColor" stroke-width="1.3" />
                <path
                  d="M3 7.2a4.5 4.5 0 0 0 9 0M7.5 11.7v1.8"
                  stroke="currentColor"
                  stroke-width="1.3"
                  stroke-linecap="round"
                />
              </svg>
            </button>
            <button class="send-btn" id="send" aria-label="Send" disabled>
              <svg class="send-glyph" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path
                  d="M7 12V2.5M3 6.2 7 2.2l4 4"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <svg class="stop-glyph" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                <rect x="2" y="2" width="8" height="8" rx="1.5" fill="currentColor" />
              </svg>
            </button>
          </div>
        </div>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

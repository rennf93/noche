[package]
name = "noche_adblock"
version = "0.0.1"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["staticlib"]

[dependencies]
adblock = { version = "=0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
serde_json = "1"

[features]
# default build is Send+Sync (Mutex regex cache); "st" = crate default single-thread (RefCell)
st = ["adblock/single-thread"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = false

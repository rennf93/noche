name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache vendored CEF
        uses: actions/cache@v4
        with:
          path: vendor
          key: cef-vendor-${{ hashFiles('scripts/fetch-cef.sh') }}

      - name: Fetch CEF
        run: scripts/fetch-cef.sh

      - name: Xcode version
        id: xcode
        run: |
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Cache CEF wrapper
        uses: actions/cache@v4
        with:
          path: build/cef
          key: cef-wrapper-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('scripts/fetch-cef.sh', 'scripts/build-cef-wrapper.sh') }}

      - name: Build CEF wrapper
        run: scripts/build-cef-wrapper.sh

      - name: Test (NocheCore only, no CEF needed)
        run: swift test

      - name: Build app
        run: scripts/build-app.sh

      - name: Smoke (fixture)
        run: scripts/smoke.sh build/Noche.app fixture

      - name: Smoke (closed port, exit 2 expected)
        run: |
          set +e
          scripts/smoke.sh build/Noche.app closed-port
          code=$?
          [ "$code" -eq 2 ] || { echo "expected exit 2, got $code"; exit 1; }

      - name: Sandbox check (seatbelt client on the renderer)
        run: scripts/check-sandbox.sh build/Noche.app
